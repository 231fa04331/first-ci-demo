
name: Student Performance ML CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train_model.py

      - name: Check model quality
        run: python quality_gate.py

      - name: Test ML pipeline
        run: python -m unittest test_ml_pipeline -v

      - name: Test Flask API
        run: python -m unittest test_app -v

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: student-performance-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
            student_performance_raw.csv
          if-no-files-found: error

      - name: Build Docker image
        run: run: docker build -f docker -t student-performance-ml:latest .

      - name: Start container
        run: |
          docker run -d --name student-performance-app \
            -p 5000:5000 student-performance-ml:latest

      - name: Test container health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-performance-app
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f student-performance-app || true
