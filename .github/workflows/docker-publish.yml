
name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-ml

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -f docker -t student-result-ml:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name student-result-ci \
            -p 5000:5000 \
            student-result-ml:ci

      - name: Test API health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done

          echo "Health check failed."
          docker logs student-result-ci
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f student-result-ci || true

      - name: Prepare GHCR image name
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY_OWNER}/student-result-ml"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Tag tested image
        run: |
          docker tag student-result-ml:ci "$IMAGE_ID:latest"
          docker tag student-result-ml:ci "$IMAGE_ID:sha-${GITHUB_SHA}"

      - name: Push tested image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${GITHUB_SHA}"

